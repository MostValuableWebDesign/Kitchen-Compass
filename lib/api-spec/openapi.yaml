openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scan
    description: Ingredient photo analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scan/analyze:
    post:
      operationId: analyzeIngredientPhotos
      tags: [scan]
      summary: Analyze kitchen photos for reviewable ingredient suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanAnalysisRequest"
      responses:
        "200":
          description: Structured ingredient suggestions for user review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAnalysisResponse"
        "400":
          description: Invalid scan request
        "503":
          description: AI analysis is unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScanPhoto:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        base64:
          type: string
          minLength: 1
      required: [id, mimeType, base64]
    ExistingIngredient:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        location:
          type: string
          enum: [Refrigerator, Freezer, Pantry]
      required: [name, location]
    ScanAnalysisRequest:
      type: object
      properties:
        photos:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/ScanPhoto"
        existingIngredients:
          type: array
          items:
            $ref: "#/components/schemas/ExistingIngredient"
      required: [photos]
    IngredientSuggestion:
      type: object
      properties:
        suggestionId:
          type: string
        normalizedName:
          type: string
        displayName:
          type: string
        storageLocation:
          type: string
          enum: [Refrigerator, Freezer, Pantry]
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
        quantityKnown:
          type: boolean
        confidence:
          type: number
          minimum: 0
          maximum: 1
        uncertaintyReasons:
          type: array
          items:
            type: string
        sourcePhotoId:
          type: string
        existingInventoryMatch:
          type: string
      required:
        - suggestionId
        - normalizedName
        - displayName
        - storageLocation
        - quantityKnown
        - confidence
        - uncertaintyReasons
        - sourcePhotoId
    ScanAnalysisResponse:
      type: object
      properties:
        scanId:
          type: string
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/IngredientSuggestion"
        warnings:
          type: array
          items:
            type: string
      required: [scanId, suggestions, warnings]


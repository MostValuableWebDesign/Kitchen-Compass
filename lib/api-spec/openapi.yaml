openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scan
    description: Ingredient photo analysis
  - name: recipes
    description: Recipe discovery from confirmed kitchen inventory
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scan/analyze:
    post:
      operationId: analyzeIngredientPhotos
      tags: [scan]
      summary: Analyze kitchen photos for reviewable ingredient suggestions
      security:
        - ScanAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanAnalysisRequest"
      responses:
        "200":
          description: Structured ingredient suggestions for user review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAnalysisResponse"
        "400":
          description: Invalid scan request
        "401":
          description: Missing or invalid installation identity
        "413":
          description: Request or decoded photo payload is too large
        "429":
          description: Installation rate limit exceeded
        "503":
          description: AI analysis is unavailable
  /scan/access:
    post:
      operationId: issueScanAccess
      tags: [scan]
      summary: Issue a server-verifiable scan credential
      responses:
        "200":
          description: Short-lived scan access credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAccessResponse"
        "429":
          description: Access issuance rate limit exceeded
        "503":
          description: Access issuance unavailable
  /recipes/discover:
    post:
      operationId: discoverRecipes
      tags: [recipes]
      summary: Discover structured recipes from confirmed kitchen inventory
      security:
        - ScanAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeDiscoveryRequest"
      responses:
        "200":
          description: Validated recipe candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDiscoveryResponse"
        "400":
          description: Invalid discovery request
        "401":
          description: Missing or invalid scan credential
        "429":
          description: Discovery rate limit exceeded
        "503":
          description: Recipe discovery is unavailable or returned no safe recipes
  /recipes/images:
    post:
      operationId: resolveRecipeImages
      tags: [recipes]
      summary: Find a matching recipe photo or generate an illustrative image
      security:
        - ScanAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeImagesRequest"
      responses:
        "200":
          description: Recipe images; entries without an image indicate provider failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        recipeVersion: { type: string }
                        imageUrl: { type: string, format: uri }
                        imageBase64: { type: string }
                        source: { type: string, enum: [TheMealDB, AI-generated] }
                      required: [recipeVersion]
                required: [images]
        "400":
          description: Invalid image request
        "401":
          description: Missing or invalid scan credential
        "429":
          description: Installation rate limit exceeded
components:
  securitySchemes:
    ScanAccess:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScanPhoto:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        base64:
          type: string
          minLength: 1
      required: [id, mimeType, base64]
    ExistingIngredient:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        location:
          type: string
          enum: [Refrigerator, Freezer, Pantry]
      required: [name, location]
    ScanAnalysisRequest:
      type: object
      properties:
        photos:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/ScanPhoto"
        existingIngredients:
          type: array
          items:
            $ref: "#/components/schemas/ExistingIngredient"
      required: [photos]
    ScanError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, INVALID_REQUEST, PAYLOAD_TOO_LARGE, RATE_LIMITED, SCAN_UNAVAILABLE]
            message:
              type: string
            requestId:
              type: string
            retryable:
              type: boolean
          required: [code, message, requestId, retryable]
      required: [error]
    IngredientSuggestion:
      type: object
      properties:
        suggestionId:
          type: string
        normalizedName:
          type: string
        displayName:
          type: string
        storageLocation:
          type: string
          enum: [Refrigerator, Freezer, Pantry]
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
        quantityKnown:
          type: boolean
        confidence:
          type: number
          minimum: 0
          maximum: 1
        uncertaintyReasons:
          type: array
          items:
            type: string
        sourcePhotoId:
          type: string
        existingInventoryMatch:
          type: string
      required:
        - suggestionId
        - normalizedName
        - displayName
        - storageLocation
        - quantityKnown
        - confidence
        - uncertaintyReasons
        - sourcePhotoId
    ScanAnalysisResponse:
      type: object
      properties:
        scanId:
          type: string
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/IngredientSuggestion"
        warnings:
          type: array
          items:
            type: string
      required: [scanId, suggestions, warnings]
    ScanAccessResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
      required: [accessToken, expiresInSeconds]
    RecipeDiscoveryInventory:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        location:
          type: string
          enum: [Refrigerator, Freezer, Pantry]
        quantityValue:
          type: number
          minimum: 0
        unit:
          type: string
        quantityKnown:
          type: boolean
        status:
          type: string
          enum: [fresh, low, used]
        confidence:
          type: string
          enum: [confirmed, uncertain]
      required: [name, location, quantityKnown, status]
    RecipeDiscoveryPreferences:
      type: object
      properties:
        allergies:
          type: array
          items: { type: string }
        dietaryRestrictions:
          type: array
          items: { type: string }
        dislikes:
          type: array
          items: { type: string }
        cuisines:
          type: array
          items: { type: string }
        skill:
          type: string
          enum: [Beginner, Comfortable, Confident]
        cookTime:
          type: integer
          minimum: 1
        equipment:
          type: array
          items: { type: string }
        nutrition:
          type: array
          items: { type: string }
      required: [allergies, dietaryRestrictions, dislikes, cuisines, skill, cookTime, equipment, nutrition]
    RecipeDiscoveryFilters:
      type: object
      properties:
        mealType:
          type: string
          enum: [Any, Breakfast, Lunch, Dinner]
        cuisine:
          type: string
        maxMinutes:
          type: integer
          minimum: 1
        equipment:
          type: array
          items: { type: string }
        dietaryPreference:
          type: string
        minHealthScore:
          type: integer
          minimum: 0
          maximum: 100
      required: [mealType]
    RecipeDiscoveryRequest:
      type: object
      properties:
        inventory:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/RecipeDiscoveryInventory"
        preferences:
          $ref: "#/components/schemas/RecipeDiscoveryPreferences"
        filters:
          $ref: "#/components/schemas/RecipeDiscoveryFilters"
        variationSeed:
          type: string
          minLength: 1
          maxLength: 80
        excludeRecipeVersions:
          type: array
          maxItems: 30
          items: { type: string }
      required: [inventory, preferences, filters, variationSeed, excludeRecipeVersions]
    RecipeIngredient:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          minLength: 1
        required:
          type: boolean
      required: [name, quantity, unit, required]
    RecipeStep:
      type: object
      properties:
        order:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 0
        temperature:
          $ref: "#/components/schemas/RecipeTemperature"
        ingredients:
          type: array
          items: { type: string }
        ingredientAmounts:
          type: array
          items:
            $ref: "#/components/schemas/RecipeStepIngredient"
        cues:
          type: array
          items: { type: string }
        safetyTemperature:
          $ref: "#/components/schemas/RecipeSafetyTemperature"
        mistakes:
          type: array
          items: { type: string }
      required: [order, title, body, ingredients, ingredientAmounts, cues, mistakes]
    RecipeTemperature:
      type: object
      properties:
        fahrenheit: { type: number }
        celsius: { type: number }
      required: [fahrenheit, celsius]
    RecipeStepIngredient:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, minLength: 1 }
        note: { type: string }
      required: [name, quantity, unit]
    RecipeSafetyTemperature:
      type: object
      properties:
        food: { type: string, minLength: 1 }
        temperature:
          $ref: "#/components/schemas/RecipeTemperature"
      required: [food, temperature]
    RecipeNutrition:
      type: object
      properties:
        status:
          type: string
          enum: [calculated, insufficient-information]
        perServing:
          $ref: "#/components/schemas/RecipeNutritionPerServing"
        total:
          $ref: "#/components/schemas/RecipeNutritionTotal"
        coveredIngredients:
          type: array
          items: { type: string }
        uncoveredIngredients:
          type: array
          items: { type: string }
        ingredientCoverage:
          type: number
          minimum: 0
          maximum: 1
        vegetableServingsPerServing:
          type: number
          minimum: 0
        source:
          $ref: "#/components/schemas/RecipeNutritionSource"
      required: [status, coveredIngredients, uncoveredIngredients, ingredientCoverage, source]
    RecipeNutritionPerServing:
      type: object
      properties:
        calories: { type: number, minimum: 0 }
        protein: { type: number, minimum: 0 }
        carbs: { type: number, minimum: 0 }
        fat: { type: number, minimum: 0 }
        fiber: { type: number, minimum: 0 }
        sodium: { type: number, minimum: 0 }
        addedSugar: { type: number, minimum: 0 }
        saturatedFat: { type: number, minimum: 0 }
      required: [calories, protein, carbs, fat, fiber, sodium, addedSugar, saturatedFat]
    RecipeNutritionTotal:
      type: object
      properties:
        calories: { type: number, minimum: 0 }
        protein: { type: number, minimum: 0 }
        carbs: { type: number, minimum: 0 }
        fat: { type: number, minimum: 0 }
        fiber: { type: number, minimum: 0 }
        sodium: { type: number, minimum: 0 }
        addedSugar: { type: number, minimum: 0 }
        saturatedFat: { type: number, minimum: 0 }
      required: [calories, protein, carbs, fat, fiber, sodium, addedSugar, saturatedFat]
    RecipeNutritionSource:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
      required: [id, label]
    RecipeScoreFactor:
      type: object
      properties:
        key:
          type: string
          enum: [vegetables, fiber, protein, sodium, added-sugar, saturated-fat]
        label: { type: string }
        direction:
          type: string
          enum: [positive, negative, neutral]
        points: { type: number }
        detail: { type: string }
      required: [key, label, direction, points, detail]
    RecipeHealthScore:
      type: object
      properties:
        status:
          type: string
          enum: [calculated, insufficient-information]
        score:
          type: integer
          minimum: 0
          maximum: 100
        note: { type: string }
        factors:
          type: array
          items:
            $ref: "#/components/schemas/RecipeScoreFactor"
      required: [status, note, factors]
    RecipeSubstitution:
      type: object
      properties:
        from:
          type: string
          minLength: 1
        to:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        validated:
          type: boolean
      required: [from, to, reason, validated]
    DiscoveredRecipe:
      type: object
      properties:
        id:
          type: string
        recipeVersion:
          type: string
        title:
          type: string
        description:
          type: string
        cuisine:
          type: string
        mealType:
          type: string
          enum: [Breakfast, Lunch, Dinner]
        servings:
          type: integer
          minimum: 1
        prepMinutes:
          type: integer
          minimum: 0
        cookMinutes:
          type: integer
          minimum: 0
        difficulty:
          type: string
          enum: [Easy, Moderate, Hard]
        equipment:
          type: array
          items: { type: string }
        healthScore:
          $ref: "#/components/schemas/RecipeHealthScore"
        ingredients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RecipeIngredient"
        nutrition:
          $ref: "#/components/schemas/RecipeNutrition"
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RecipeStep"
        allergens:
          type: array
          items: { type: string }
        allergenInfo:
          type: string
          enum: [complete, incomplete]
        storageInstructions:
          type: string
        reheatingInstructions:
          type: string
        servingSuggestions:
          type: array
          items: { type: string }
        commonMistakes:
          type: array
          items: { type: string }
        dietaryTags:
          type: array
          items: { type: string }
        dislikeTags:
          type: array
          items: { type: string }
        nutritionTags:
          type: array
          items: { type: string }
        substitutions:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSubstitution"
      required:
        - id
        - recipeVersion
        - title
        - description
        - cuisine
        - mealType
        - servings
        - prepMinutes
        - cookMinutes
        - difficulty
        - equipment
        - healthScore
        - ingredients
        - nutrition
        - steps
        - allergens
        - allergenInfo
        - storageInstructions
        - reheatingInstructions
        - servingSuggestions
        - commonMistakes
        - dietaryTags
        - dislikeTags
        - nutritionTags
        - substitutions
    RecipeDiscoveryResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredRecipe"
        source:
          type: string
          enum: [server-ai]
        warning:
          type: string
      required: [recipes, source]
    RecipeImagesRequest:
      type: object
      properties:
        recipes:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            properties:
              recipeVersion: { type: string }
              title: { type: string }
              description: { type: string }
              ingredients:
                type: array
                items: { type: string }
            required: [recipeVersion, title, description, ingredients]
      required: [recipes]
